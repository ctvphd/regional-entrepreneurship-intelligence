[project]
name = "regional-entrepreneurship-intelligence"
version = "0.1.0"
description = "Predictive business analytics foundation for regional entrepreneurship intelligence."
requires-python = ">=3.10"
dependencies = [
    "jupyter>=1.1.1",
    "matplotlib>=3.10.9",
    "numpy>=2.2.6",
    "pandas>=2.3.3",
    "plotly>=7.1.0",
    "pyarrow>=25.0.1",
    "requests>=2.34.2",
    "scikit-learn>=1.7.2",
    "statsmodels>=0.15.0",
    "streamlit>=1.65.0",
    "xlrd>=2.0.2",
]

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"
